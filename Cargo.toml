[package]
name = "cartouche"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Encoding and decoding for HDMI InfoFrames."
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/cartouche"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "infoframe", "hdr"]
categories = ["hardware-support", "embedded", "encoding", "no-std", "no-std::no-alloc"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde", "display-types/serde"]

[dependencies]
display-types = { version = "0.4", default-features = false }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.149"
